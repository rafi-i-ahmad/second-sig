[project]
name = "second-sig"
version = "0.1.0"
description = "An extra signer for Safe multisigs: simulates a proposal on a fork, checks it against its description, signs a stamp on a match."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "web3>=7.0",
    "eth-account>=0.13",
    "google-genai>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "sse-starlette>=3.5.1",
]

[project.scripts]
secondsig = "cli.secondsig:app"

[dependency-groups]
dev = ["pytest>=8.0"]
investigate = [
    "google-antigravity>=0.1.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["judge", "cli", "sepolia", "eval", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Gemini API; needs --live and GEMINI_API_KEY"]
